<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRUD Penguin</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family: system-ui, sans-serif; color:#0b2a3a;
         background:linear-gradient(#bfe9ff,#eafaff); display:flex; min-height:100vh;
         align-items:center; justify-content:center; }
  .card { background:#fff; padding:2.2rem 2.6rem; border-radius:16px; width:320px;
          box-shadow:0 10px 34px rgba(10,60,90,.18); text-align:center; }
  .logo { font-size:2.4rem; }
  h1 { font-size:1.3rem; margin:.2rem 0 1.4rem; color:#0a7bb8; }
  label { display:block; font-size:.82rem; color:#5a7585; margin:.8rem 0 .25rem; text-align:left; }
  input { width:100%; box-sizing:border-box; padding:.6rem .7rem; border:1px solid #bfe0ef;
          border-radius:9px; font-size:.95rem; }
  button { width:100%; margin-top:1.4rem; padding:.7rem; border:0; border-radius:10px;
           background:#12b0e8; color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  .err { background:#fde8e8; color:#a4232a; padding:.5rem .7rem; border-radius:7px; font-size:.85rem; }
  .hint { margin-top:1.1rem; font-size:.75rem; color:#8aa4b3; }
  .mode { position:fixed; top:10px; right:12px; font-size:.75rem; padding:.25rem .6rem; border-radius:6px;
          background:#0b2a3a; color:#fff; letter-spacing:.05em; }
</style>
</head>
<body>
  <span class="mode">modo: {{ mode }}</span>
  <form class="card" method="post" action="/login">
    <div class="logo">&#128039;</div>
    <h1>CRUD Penguin</h1>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label>Pinguino</label>
    <input name="usuario" autocomplete="off" autofocus>
    <label>Clave</label>
    <input name="clave" type="password" autocomplete="off">
    <button type="submit">Entrar al iglu</button>
    <p class="hint">Demo: pingu1 / hielo123</p>
  </form>
</body>
</html>
