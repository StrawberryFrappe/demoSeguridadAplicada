<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi iglu - CRUD Penguin</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family: system-ui, sans-serif; color:#0b2a3a; background:#eafaff; }
  header { background:#12b0e8; color:#fff; padding:1rem 1.6rem; display:flex;
           justify-content:space-between; align-items:center; }
  header a { color:#e3f6ff; font-size:.85rem; }
  main { max-width:640px; margin:1.8rem auto; padding:0 1.2rem; }
  .card { background:#fff; border-radius:16px; box-shadow:0 8px 28px rgba(10,60,90,.12);
          padding:1.5rem 1.7rem; margin-bottom:1.4rem; }
  .row { display:flex; justify-content:space-between; padding:.55rem 0; border-bottom:1px solid #eafaff; }
  .row b { color:#5a7585; font-weight:600; }
  .email { font-family: ui-monospace, monospace; }
  .coins { font-size:1.8rem; font-weight:700; color:#0a7bb8; }
  a.btn { display:inline-block; margin-top:.4rem; background:#12b0e8; color:#fff; padding:.55rem 1.1rem;
          border-radius:10px; text-decoration:none; font-size:.9rem; }
  .mode { font-size:.75rem; padding:.25rem .6rem; border-radius:6px; background:#064863; }
</style>
</head>
<body>
  <header>
    <strong>&#128039; Iglu de {{ u.username }}</strong>
    <span><span class="mode">modo: {{ mode }}</span> &nbsp; <a href="/logout">Salir</a></span>
  </header>
  <main>
    <div class="card">
      <h2 style="margin-top:0">Monedas</h2>
      <div class="coins">{{ u.monedas }} &#129689;</div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Cuenta</h2>
      <div class="row"><b>Correo de recuperacion</b><span class="email">{{ u.recovery_email }}</span></div>
      <a class="btn" href="/cuenta">Editar cuenta</a>
    </div>
  </main>
</body>
</html>
