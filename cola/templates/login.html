<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingreso - Inscripcion de ramos</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family: system-ui, sans-serif; background:#eef2f6; color:#1b2733;
         display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { background:#fff; padding:2.2rem 2.6rem; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.12);
          width:320px; }
  h1 { font-size:1.15rem; margin:0 0 1.3rem; }
  label { display:block; font-size:.82rem; color:#5a6b7b; margin:.8rem 0 .25rem; }
  input { width:100%; box-sizing:border-box; padding:.6rem .7rem; border:1px solid #cdd7e1;
          border-radius:7px; font-size:.95rem; }
  button { width:100%; margin-top:1.4rem; padding:.7rem; border:0; border-radius:8px; background:#0a6cff;
           color:#fff; font-size:1rem; cursor:pointer; }
  .err { background:#fde8e8; color:#a4232a; padding:.5rem .7rem; border-radius:7px; font-size:.85rem;
         margin-bottom:1rem; }
  .hint { margin-top:1.1rem; font-size:.75rem; color:#8696a7; text-align:center; }
  .mode { position:fixed; top:10px; right:12px; font-size:.75rem; padding:.25rem .6rem; border-radius:6px;
          background:#1b2733; color:#fff; letter-spacing:.05em; }
</style>
</head>
<body>
  <span class="mode">modo: {{ mode }}</span>
  <form class="card" method="post" action="/login">
    <h1>Inscripcion de Ramos</h1>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label>Usuario</label>
    <input name="usuario" autocomplete="off" autofocus>
    <label>Clave</label>
    <input name="clave" type="password" autocomplete="off">
    <button type="submit">Ingresar</button>
    <p class="hint">Demo: estudiante1 / clave123</p>
  </form>
</body>
</html>
